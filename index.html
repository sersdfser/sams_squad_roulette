<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sam's Squad Roulette</title>
    <style>
        body {
            background-color: #121212; 
            font-family: 'Arial Black', sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            overflow-x: hidden;
            user-select: none;
        }

        h1 {
            color: #f3af19;
            text-transform: uppercase;
            font-size: 2rem;
            text-shadow: 3px 3px 0px #000;
            margin-bottom: 20px;
            text-align: center;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
            max-width: 800px;
            z-index: 2;
        }

        /* --- LOCATIONS --- */
        .location-section { width: 100%; }

        .wheel-card {
            background: #1e285a;
            border: 3px solid #bb54e1;
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            position: relative;
        }

        .wheel-card.location { border-color: #f3af19; }

        .card-header {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 5px;
        }

        .wheel-title {
            color: #fff;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
            margin: 0;
        }

        .reroll-btn {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.3);
            color: rgba(255,255,255,0.8);
            cursor: pointer;
            font-size: 0.8rem;
            padding: 2px 8px;
            border-radius: 4px;
            transition: all 0.2s;
        }
        .reroll-btn:hover { background: white; color: black; }

        /* --- PLAYER GRID --- */
        .player-grid {
            display: grid;
            grid-template-columns: 1fr 1fr; 
            gap: 10px;
            width: 100%;
        }

        /* --- WINDOWS --- */
        .window {
            height: 70px; 
            background: #000;
            border: 2px solid #555;
            border-radius: 6px;
            overflow: hidden;
            position: relative;
        }

        .location .window {
            height: 90px; 
            border-color: #f3af19;
        }

        .strip {
            width: 100%;
            transform: translateY(0px); 
            will-change: transform;
        }

        .strip div {
            height: 70px; 
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            text-align: center;
            width: 100%;
            color: white;
            border-bottom: 1px solid #333;
            box-sizing: border-box;
            padding: 0 5px;
            line-height: 1.1;
        }

        .location .strip div {
            height: 90px;
            font-size: 1.5rem;
            color: #f3af19;
        }

        /* --- CONTROLS --- */
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 15px;
            justify-content: center;
            padding-bottom: 40px;
            width: 100%;
            z-index: 2;
        }

        button.spin-btn {
            background: #f3af19;
            color: black;
            border: none;
            padding: 15px 0;
            width: 200px;
            font-family: 'Arial Black', sans-serif;
            font-size: 1.5rem;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 4px 0 #b37e00;
            border-radius: 8px;
            transition: transform 0.1s;
        }

        button.spin-btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        button.secondary {
            background: #444;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            width: 100px;
            box-shadow: 0 4px 0 #222;
            cursor: pointer;
        }

        /* --- EDIT MODAL --- */
        #edit-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.95);
            z-index: 999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
        }
        
        textarea {
            width: 90%;
            max-width: 600px;
            height: 100px;
            margin-bottom: 20px;
            background: #222;
            color: white;
            border: 1px solid #555;
            font-family: monospace;
            padding: 10px;
        }

        #confetti {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        @media (max-width: 600px) {
            .player-grid { grid-template-columns: 1fr; }
            h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <canvas id="confetti"></canvas>

    <h1>Squad Mode</h1>

    <div class="main-container">
        
        <div class="location-section">
            <div class="wheel-card location">
                <div class="card-header">
                    <div class="wheel-title">DROP ZONE</div>
                    <button class="reroll-btn" onclick="reroll('strip-loc', appData.loc, 90)">↻</button>
                </div>
                <div class="window">
                    <div class="strip" id="strip-loc"></div>
                </div>
            </div>
        </div>

        <div class="player-grid">
            <div class="wheel-card">
                <div class="card-header">
                    <div class="wheel-title" style="color:#bb54e1; text-shadow: 0 0 5px #bb54e1;">JCAHO</div>
                    <button class="reroll-btn" onclick="reroll('strip-p1', appData.rules, 70)">↻</button>
                </div>
                <div class="window">
                    <div class="strip" id="strip-p1"></div>
                </div>
            </div>

            <div class="wheel-card">
                <div class="card-header">
                    <div class="wheel-title" style="color:#f3af19; text-shadow: 0 0 5px #f3af19;">SEXY SAMMY</div>
                    <button class="reroll-btn" onclick="reroll('strip-p2', appData.rules, 70)">↻</button>
                </div>
                <div class="window">
                    <div class="strip" id="strip-p2"></div>
                </div>
            </div>

            <div class="wheel-card">
                <div class="card-header">
                    <div class="wheel-title" style="color:#ff4444; text-shadow: 0 0 5px #ff4444;">"CUTEST IN THE WORLD" COLTON</div>
                    <button class="reroll-btn" onclick="reroll('strip-p3', appData.rules, 70)">↻</button>
                </div>
                <div class="window">
                    <div class="strip" id="strip-p3"></div>
                </div>
            </div>

            <div class="wheel-card">
                <div class="card-header">
                    <div class="wheel-title" style="color:#42bff5; text-shadow: 0 0 5px #42bff5;">SWEARING SARAH</div>
                    <button class="reroll-btn" onclick="reroll('strip-p4', appData.rules, 70)">↻</button>
                </div>
                <div class="window">
                    <div class="strip" id="strip-p4"></div>
                </div>
            </div>
        </div>

    </div>

    <div class="controls">
        <button class="spin-btn" onclick="spinAll()">SPIN!</button>
        <button class="secondary" onclick="toggleEdit()">Edit</button>
    </div>

    <div id="edit-modal">
        <h2 style="color:white; margin-bottom: 10px;">Edit Lists</h2>
        <p style="color:#f3af19; margin: 5px;">Locations</p>
        <textarea id="input-loc"></textarea>
        <p style="color:#f3af19; margin: 5px;">Global Rules</p>
        <textarea id="input-rules" style="height: 150px;"></textarea>
        <div style="display:flex; gap:10px;">
            <button class="spin-btn" style="width:100px; font-size:1rem;" onclick="saveEdit()">Save</button>
            <button class="secondary" onclick="toggleEdit()">Cancel</button>
        </div>
    </div>

    <script>
        // --- DATA ---
        let appData = {
            loc: [
                "Wonkeeland", "Clausy Lodge", "Lethal Labs", "Latte Landing", 
                "Painted Palms", "Tiptop Terrace", "Sandy Strip", "Fore Fields", 
                "Bumpy Bay", "Humble Hills", "Sus Studios", "Ripped Tides", 
                "Classified Canyon", "Battlewood Boulevard", "Hot Drop"
            ],
            rules: [
                "Grey Weapons Only", "Shotguns Only", "Snipers Only", "Pistols Only", 
                "No Healing Items", "Gold/Mythic Only", "SMG Only", "One Gun Slot", 
                "Explosives Only", "One Weapon Only", "Rainbow Challenge", 
                "First Chest Challenge", "Gold Only", "One Slot Only", "No Building", 
                "Green Weapons Only", "Blue Weapons Only", "No Healing", 
                "No Shooting from Ground", "Purple/Gold Only", "Gray Weapons Only", 
                "Purple Weapons Only", "Fish Weapons Only", "No Kills", 
                "Only Throwables", "No Medium Ammo Weapons", "No Light Ammo Weapons", 
                "No Shotguns", "Must Land at Boss Location", "No Aiming Down Sights", 
                "2 Minutes to Loot Weapons Only", "No Shields", "No Sniper", 
                "Trade Your Loot With Who You Kill", "Do 2 Challenges", "No Challenge", 
                "Vending Machine Weapons Only", "Only Assault Rifle", "Only Shotgun", 
                "Only SMG", "Only Sniper", "Only Pistol", "No Jumping", "No Sprinting", 
                "No Touching Grass", "Land at Farthest Named Spot from Bus Route", 
                "Only Loot from Defeated Opponents", "Must Follow Sam's Orders", 
                "Must Follow Jacey's Orders", "Must Follow Colton's Orders", 
                "Must Follow Sarah's Orders", "Must Emote on Knock", "No Talking", 
                "Full Aggression", "Pacifist (Top 10)", "Protect the President", 
                "Hipfire Only", "lasers only"
            ]
        };

        // --- AUDIO ENGINE (Web Audio API) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playTick() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            // Create a short, percussive "tick"
            osc.type = 'square';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.05);
            
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        }

        function playFanfare() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const now = audioCtx.currentTime;
            // Major Triad Arpeggio (C - E - G - High C)
            const notes = [523.25, 659.25, 783.99, 1046.50];
            
            notes.forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = 'triangle';
                osc.frequency.value = freq;
                
                // Stagger entrances
                const startTime = now + (i * 0.1);
                
                gain.gain.setValueAtTime(0, startTime);
                gain.gain.linearRampToValueAtTime(0.2, startTime + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.001, startTime + 1.5);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(startTime);
                osc.stop(startTime + 1.5);
            });
        }

        function startTickingLoop(durationSec) {
            let count = 0;
            const maxTicks = durationSec * 10; // Approx 10 ticks per second
            
            // Initial fast ticks
            let interval = setInterval(() => {
                playTick();
                count++;
                if(count > maxTicks) clearInterval(interval);
            }, 100);

            // Stop ticking slightly before the end
            setTimeout(() => clearInterval(interval), (durationSec * 1000) - 500);
        }


        // --- LOGIC ---

        function buildStrip(id, items, height) {
            const strip = document.getElementById(id);
            if(!strip) return;
            
            let html = "";
            for(let i=0; i<40; i++) {
                items.forEach(item => {
                    html += `<div>${item}</div>`;
                });
            }
            strip.innerHTML = html;
        }

        function refreshApp() {
            buildStrip('strip-loc', appData.loc, 90);
            buildStrip('strip-p1', appData.rules, 70);
            buildStrip('strip-p2', appData.rules, 70);
            buildStrip('strip-p3', appData.rules, 70);
            buildStrip('strip-p4', appData.rules, 70);
        }

        function doSpin(id, items, itemHeight, isReroll) {
            const strip = document.getElementById(id);
            const winnerIndex = Math.floor(Math.random() * items.length);
            
            // For rerolls, we don't need to spin quite as long
            const loops = isReroll ? 10 : 25;
            const targetIndex = (loops * items.length) + winnerIndex;
            const offset = -(targetIndex * itemHeight);

            strip.style.transition = 'none';
            strip.style.transform = 'translateY(0px)';
            strip.offsetHeight; 

            // Variance in time
            const time = isReroll ? 1.5 : (2.5 + Math.random());
            
            strip.style.transition = `transform ${time}s cubic-bezier(0.1, 0.9, 0.2, 1)`;
            strip.style.transform = `translateY(${offset}px)`;
            
            return time;
        }

        function spinAll() {
            // Wake up audio context on user gesture
            if (audioCtx.state === 'suspended') audioCtx.resume();

            // Start ticking sound for 3 seconds
            startTickingLoop(3);

            doSpin('strip-loc', appData.loc, 90, false);
            
            setTimeout(() => doSpin('strip-p1', appData.rules, 70, false), 100);
            setTimeout(() => doSpin('strip-p2', appData.rules, 70, false), 200);
            setTimeout(() => doSpin('strip-p3', appData.rules, 70, false), 300);
            setTimeout(() => doSpin('strip-p4', appData.rules, 70, false), 400);

            // Win sound & Confetti
            setTimeout(() => {
                playFanfare();
                fireConfetti();
            }, 3000);
        }

        function reroll(id, items, height) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            startTickingLoop(1.5);
            doSpin(id, items, height, true);
        }

        function toggleEdit() {
            const modal = document.getElementById('edit-modal');
            if(modal.style.display === 'flex') {
                modal.style.display = 'none';
            } else {
                document.getElementById('input-loc').value = appData.loc.join(',');
                document.getElementById('input-rules').value = appData.rules.join(',');
                modal.style.display = 'flex';
            }
        }

        function saveEdit() {
            const locRaw = document.getElementById('input-loc').value;
            const rulesRaw = document.getElementById('input-rules').value;
            if(locRaw) appData.loc = locRaw.split(',').map(s=>s.trim()).filter(s=>s);
            if(rulesRaw) appData.rules = rulesRaw.split(',').map(s=>s.trim()).filter(s=>s);
            refreshApp();
            document.getElementById('edit-modal').style.display = 'none';
        }

        // --- CONFETTI ---
        function fireConfetti() {
            const canvas = document.getElementById('confetti');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particles = [];
            const colors = ['#f3af19', '#bb54e1', '#42bff5', '#ff4444']; 

            for(let i=0; i<150; i++) {
                particles.push({
                    x: canvas.width / 2, // Start from center
                    y: canvas.height / 2,
                    size: Math.random() * 8 + 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    speedX: (Math.random() - 0.5) * 15, // Explode outward
                    speedY: (Math.random() - 0.5) * 15,
                    gravity: 0.1,
                    angle: Math.random() * 6.2
                });
            }

            let frame = 0;
            function animate() {
                ctx.clearRect(0,0, canvas.width, canvas.height);
                let active = false;
                particles.forEach(p => {
                    p.speedY += p.gravity;
                    p.x += p.speedX;
                    p.y += p.speedY;
                    p.speedX *= 0.96; // Air resistance
                    p.speedY *= 0.96;

                    if(p.y < canvas.height && p.x > 0 && p.x < canvas.width) {
                        ctx.fillStyle = p.color;
                        ctx.fillRect(p.x, p.y, p.size, p.size);
                        active = true;
                    }
                });
                frame++;
                if(active && frame < 300) requestAnimationFrame(animate);
                else ctx.clearRect(0,0, canvas.width, canvas.height);
            }
            animate();
        }

        window.onload = function() {
            refreshApp();
        };
    </script>
</body>
</html>
